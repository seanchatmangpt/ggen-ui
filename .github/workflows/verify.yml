name: Verify ggen-ui visual composer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-ui-composer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MARKETPLACE_REPO: seanchatmangpt/ggen-marketplace
  MARKETPLACE_REF: ebc53dd7ce2c936c75fa87ea1f63fe2a2c321e82

jobs:
  verify:
    name: Exact-head manufacture, Nuxt court, runtime receipt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact ggen-ui subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ggen-ui
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout admitted marketplace authority source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.MARKETPLACE_REPO }}
          ref: ${{ env.MARKETPLACE_REF }}
          path: ggen-marketplace
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identities
        shell: bash
        run: |
          set -euo pipefail
          expected_ui="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_ui="$(git -C ggen-ui rev-parse HEAD)"
          actual_marketplace="$(git -C ggen-marketplace rev-parse HEAD)"
          test "$actual_ui" = "$expected_ui"
          test "$actual_marketplace" = "$MARKETPLACE_REF"
          echo "UI_SHA=$actual_ui" >> "$GITHUB_ENV"
          echo "MARKETPLACE_SHA=$actual_marketplace" >> "$GITHUB_ENV"

      - name: Set up marketplace admission toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt

      - name: Admit marketplace operational law
        shell: bash
        working-directory: ggen-marketplace
        run: |
          set -euo pipefail
          bash scripts/admit-config.sh marketplace.toml "${RUNNER_TEMP}/admitted-config.json" >/dev/null
          python -m json.tool "${RUNNER_TEMP}/admitted-config.json" >/dev/null

      - name: Install exact admitted ggen runtime
        shell: bash
        working-directory: ggen-marketplace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ggen_bin="$(bash scripts/install-ggen.sh "${RUNNER_TEMP}/admitted-config.json")"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
          "$ggen_bin" --version | tee "${RUNNER_TEMP}/ggen-version.txt"

      - name: Manufacture visual component catalog twice
        shell: bash
        working-directory: ggen-ui
        run: |
          set -euo pipefail
          rm -rf app/generated .ggen .ggen-v2
          "$GGEN_BIN" sync run
          test -s app/generated/component-catalog.ts
          cp app/generated/component-catalog.ts "${RUNNER_TEMP}/component-catalog-a.ts"
          rm -rf app/generated
          "$GGEN_BIN" sync run
          cmp "${RUNNER_TEMP}/component-catalog-a.ts" app/generated/component-catalog.ts

          # ggen's own operational receipts are expected evidence, not source mutation.
          # Preserve only non-secret receipt material. Ephemeral signing keys never leave
          # the runner and are destroyed before the source-cleanliness court.
          test -s .ggen-v2/receipt.json
          test -s .ggen-v2/receipt-log.jsonl
          cp .ggen-v2/receipt.json "${RUNNER_TEMP}/ggen-receipt.json"
          cp .ggen-v2/receipt-log.jsonl "${RUNNER_TEMP}/ggen-receipt-log.jsonl"
          rm -rf .ggen .ggen-v2

          git diff --exit-code
          unexpected="$(git status --porcelain --untracked-files=all || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error title=REFUSED:MANUFACTURE_MUTATED_SOURCE::$unexpected"
            exit 2
          fi
          sha256sum app/generated/component-catalog.ts | tee "${RUNNER_TEMP}/component-catalog.sha256"
          sha256sum "${RUNNER_TEMP}/ggen-receipt.json" | tee "${RUNNER_TEMP}/ggen-receipt.sha256"

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'

      - name: Resolve install graph
        working-directory: ggen-ui
        run: npm install --ignore-scripts

      - name: Repair npm lock projection
        working-directory: ggen-ui
        run: npm install --package-lock-only --ignore-scripts

      - name: Install frozen resolved dependencies
        working-directory: ggen-ui
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts

      - name: Prepare Nuxt explicitly
        working-directory: ggen-ui
        run: npm run prepare

      - name: Typecheck
        working-directory: ggen-ui
        run: npm run typecheck

      - name: Production build
        working-directory: ggen-ui
        run: npm run build

      - name: Execute exact-head SSR runtime smoke
        shell: bash
        working-directory: ggen-ui
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 > "${RUNNER_TEMP}/preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > "${RUNNER_TEMP}/index.html"; then
              break
            fi
            sleep 1
          done
          grep -q "GGen UI" "${RUNNER_TEMP}/index.html"
          grep -q "Visual composition, not industry closure" "${RUNNER_TEMP}/index.html"

      - name: Emit scoped verification receipt
        shell: bash
        working-directory: ggen-ui
        run: |
          set -euo pipefail
          catalog_sha="$(awk '{print $1}' "${RUNNER_TEMP}/component-catalog.sha256")"
          ggen_receipt_sha="$(awk '{print $1}' "${RUNNER_TEMP}/ggen-receipt.sha256")"
          lock_sha="$(sha256sum package-lock.json | awk '{print $1}')"
          python - "$UI_SHA" "$MARKETPLACE_SHA" "$catalog_sha" "$ggen_receipt_sha" "$lock_sha" > "${RUNNER_TEMP}/ggen-ui-verification.json" <<'PY'
          import json, sys
          print(json.dumps({
            "schema": "https://ggen.io/schema/ui-verification-receipt/v1",
            "subject": {"repository": "seanchatmangpt/ggen-ui", "sha": sys.argv[1]},
            "ggen_authority_source": {"repository": "seanchatmangpt/ggen-marketplace", "sha": sys.argv[2]},
            "generated_component_catalog_sha256": sys.argv[3],
            "ggen_receipt_sha256": sys.argv[4],
            "package_lock_sha256": sys.argv[5],
            "executed": ["ggen-sync-run-x2", "npm-frozen-install", "nuxt-prepare", "typecheck", "production-build", "ssr-runtime-smoke"],
            "dependency_hooks": "REFUSED_BY_IGNORE_SCRIPTS",
            "live_brce_transport": False,
            "standing": "PARTIAL_ALIVE",
            "scope": "ontology manufacture + frozen dependency install + Nuxt type/build + SSR execution; no browser interaction or external DO"
          }, sort_keys=True, indent=2))
          PY
          python -m json.tool "${RUNNER_TEMP}/ggen-ui-verification.json" >/dev/null

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ggen-ui-composer-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/admitted-config.json
            ${{ runner.temp }}/ggen-version.txt
            ${{ runner.temp }}/component-catalog.sha256
            ${{ runner.temp }}/ggen-receipt.json
            ${{ runner.temp }}/ggen-receipt-log.jsonl
            ${{ runner.temp }}/ggen-receipt.sha256
            ${{ runner.temp }}/preview.log
            ${{ runner.temp }}/index.html
            ${{ runner.temp }}/ggen-ui-verification.json
            ggen-ui/package-lock.json
          if-no-files-found: warn
          retention-days: 14
