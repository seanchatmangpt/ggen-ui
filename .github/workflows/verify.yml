name: Verify ggen-ui

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ggen-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MARKETPLACE_REPO: seanchatmangpt/ggen-marketplace
  MARKETPLACE_REF: bba99ff12533b7c8da3d5eaa7e88e8d5fe0133c6

jobs:
  verify:
    name: Exact-head manufacture, build, browser, receipt
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact ggen-ui subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ggen-ui
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact marketplace manufacturer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MARKETPLACE_REPO }}
          ref: ${{ env.MARKETPLACE_REF }}
          path: ggen-marketplace
          fetch-depth: 1
          persist-credentials: false

      - name: Assert source identities
        shell: bash
        run: |
          set -euo pipefail
          expected_ui="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_ui="$(git -C ggen-ui rev-parse HEAD)"
          actual_marketplace="$(git -C ggen-marketplace rev-parse HEAD)"
          test "$actual_ui" = "$expected_ui" || { echo "::error title=REFUSED:UI_HEAD_MISMATCH::actual=$actual_ui expected=$expected_ui"; exit 2; }
          test "$actual_marketplace" = "$MARKETPLACE_REF" || { echo "::error title=REFUSED:MARKETPLACE_HEAD_MISMATCH::actual=$actual_marketplace expected=$MARKETPLACE_REF"; exit 2; }
          echo "UI_SHA=$actual_ui" >> "$GITHUB_ENV"
          echo "MARKETPLACE_SHA=$actual_marketplace" >> "$GITHUB_ENV"

      - name: Set up marketplace admission toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-06-22
          components: rustfmt

      - name: Admit marketplace operational law
        shell: bash
        working-directory: ggen-marketplace
        run: |
          set -euo pipefail
          bash scripts/admit-config.sh marketplace.toml "${RUNNER_TEMP}/admitted-config.json" >/dev/null
          python -m json.tool "${RUNNER_TEMP}/admitted-config.json" >/dev/null

      - name: Install exact admitted ggen runtime
        shell: bash
        working-directory: ggen-marketplace
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ggen_bin="$(bash scripts/install-ggen.sh "${RUNNER_TEMP}/admitted-config.json")"
          echo "GGEN_BIN=$ggen_bin" >> "$GITHUB_ENV"
          "$ggen_bin" --version | tee "${RUNNER_TEMP}/ggen-version.txt"

      - name: Manufacture dashboard consequences twice
        shell: bash
        working-directory: ggen-ui
        run: |
          set -euo pipefail
          rm -rf src/generated
          "$GGEN_BIN" sync run
          test -s src/generated/dashboard-contract.ts
          test -s src/generated/dashboard-contract.json
          test -s src/generated/projections.ts
          test -s src/generated/semantic-tokens.css
          mkdir -p "${RUNNER_TEMP}/generated-a"
          cp -a src/generated/. "${RUNNER_TEMP}/generated-a/"
          (
            cd src/generated
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "${RUNNER_TEMP}/generated-a.sha256"
          rm -rf src/generated
          "$GGEN_BIN" sync run
          (
            cd src/generated
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "${RUNNER_TEMP}/generated-b.sha256"
          cmp "${RUNNER_TEMP}/generated-a.sha256" "${RUNNER_TEMP}/generated-b.sha256"
          diff -rq "${RUNNER_TEMP}/generated-a" src/generated

      - name: Refuse unexpected manufacture mutation
        shell: bash
        working-directory: ggen-ui
        run: |
          set -euo pipefail
          bad="$(git status --porcelain --untracked-files=all | grep -vE '^\?\? src/generated/' || true)"
          if [[ -n "$bad" ]]; then
            echo "::error title=REFUSED:MANUFACTURE_MUTATED_SOURCE::$bad"
            exit 2
          fi

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.8.0'
          cache: npm
          cache-dependency-path: ggen-ui/package.json

      - name: Install exact direct dependencies
        working-directory: ggen-ui
        run: npm install --package-lock=false

      - name: Verify generated authority contract
        working-directory: ggen-ui
        run: npm run verify:source

      - name: Typecheck
        working-directory: ggen-ui
        run: npm run typecheck

      - name: Production build
        working-directory: ggen-ui
        run: npm run build

      - name: Install Chromium verifier
        working-directory: ggen-ui
        run: npx playwright install --with-deps chromium

      - name: Execute browser and accessibility courts
        working-directory: ggen-ui
        run: npm run test:e2e

      - name: Emit verification receipt
        shell: bash
        working-directory: ggen-ui
        run: |
          set -euo pipefail
          contract_sha="$(sha256sum src/generated/dashboard-contract.json | awk '{print $1}')"
          projection_sha="$(sha256sum src/generated/projections.ts | awk '{print $1}')"
          python - "$UI_SHA" "$MARKETPLACE_SHA" "$contract_sha" "$projection_sha" > "${RUNNER_TEMP}/ggen-ui-verification.json" <<'PY'
          import json, sys
          print(json.dumps({
              "schema": "https://ggen.io/schema/ui-verification-receipt/v1",
              "subject": {"repository": "seanchatmangpt/ggen-ui", "sha": sys.argv[1]},
              "manufacturer": {"repository": "seanchatmangpt/ggen-marketplace", "sha": sys.argv[2], "pack": "ggen-dashboard-pack"},
              "generated": {"dashboard_contract_sha256": sys.argv[3], "projections_sha256": sys.argv[4]},
              "executed": ["ggen-sync-run-x2", "source-verifier", "typescript", "next-production-build", "chromium", "axe"],
              "authority_ceiling": "CONSTRUCT_WITH_EXPLICIT_BRCE_TRANSPORT",
              "live_brce_transport": False,
              "standing": "PARTIAL_ALIVE",
              "scope": "manufacture+build+browser; no external DO",
          }, sort_keys=True, indent=2))
          PY
          python -m json.tool "${RUNNER_TEMP}/ggen-ui-verification.json" >/dev/null

      - name: Preserve exact-subject verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ggen-ui-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/admitted-config.json
            ${{ runner.temp }}/ggen-version.txt
            ${{ runner.temp }}/generated-a.sha256
            ${{ runner.temp }}/generated-b.sha256
            ${{ runner.temp }}/ggen-ui-verification.json
            ggen-ui/test-results
          if-no-files-found: warn
          retention-days: 14
